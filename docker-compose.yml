# Pigeonhole: the app and its database. That is the whole stack.
#
#   make up       # writes .env on first run, builds, starts, waits until healthy
#
# The app migrates the schema on boot, serves the API, UI and MCP, drains the
# job queue and runs the nightly evals, all in one container. Postgres
# publishes no port: only the app can reach it.
#
# Optional: `laya`, a local decision model, starts only with COMPOSE_PROFILES=laya
# in .env. docker-compose.gpu.yml puts it on an NVIDIA GPU. See docs/laya.md.

name: pigeonhole

services:
  app:
    image: pigeonhole
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://pigeonhole:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (make init)}@postgres:5432/pigeonhole
    # Loopback only by default. Put a TLS proxy in front before widening this.
    ports:
      - "${PH_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js", "/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      resources: { limits: { memory: 768M } }
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pigeonhole
      POSTGRES_USER: pigeonhole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (make init)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pigeonhole -d pigeonhole"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources: { limits: { memory: 1G } }
    logging: *logging

  # Laya behind laya-serve, for the laya* runtime models. The app reaches it at
  # http://laya:8000 (LAYA_URL); it publishes no port. The first start
  # downloads two checkpoints (about 1.5 GB) into the laya-models volume.
  laya:
    profiles: [laya]
    image: pigeonhole-laya
    build:
      context: docker/laya
      args:
        TORCH_INDEX: ${LAYA_TORCH_INDEX:-cpu}
    restart: unless-stopped
    # Not env_file: the model server has no business holding the OpenRouter key.
    environment:
      LAYA_DEVICE: ${LAYA_DEVICE:-cpu}
      # Build the checkpoints before listening, so healthy means ready.
      LAYA_PRELOAD: "1"
      LAYA_MODELS: ${LAYA_MODELS:-english,multilingual}
      LAYA_THREADS: ${LAYA_THREADS:-4}
      OMP_NUM_THREADS: ${LAYA_THREADS:-4}
      LAYA_API_KEY: ${LAYA_API_KEY:-}
    volumes:
      - laya-models:/home/laya/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15m
      start_interval: 5s
    deploy:
      resources: { limits: { memory: 6G } }
    logging: *logging

volumes:
  pgdata: {}
  laya-models: {}
