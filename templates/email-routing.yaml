pigeonhole: 1
id: email-routing
description: >
  Route inbound mail to a shared company address: sales, partnerships,
  invoices, support, recruiting or junk.

input:
  type: object
  properties:
    from: { type: string }
    subject: { type: string }
    body: { type: string, maxLength: 20000 }
  required: [body]

model:
  runtime: jev-latest
  compiler: anthropic/claude-sonnet-5

nodes:
  destination:
    type: choice
    instructions: Which inbox should this email go to?
    criteria:
      sales:
        what: Someone interested in buying, asking about pricing, plans, trials or demos.
        not_for: Someone selling something to us, which is junk or partnerships.
        examples:
          - "What does the team plan cost for 40 seats?"
      partnerships:
        what: "A proposal to work together: integrations, reselling, co-marketing, events."
        not_for: A vendor cold-pitching a service to us, which is junk.
      invoices:
        what: Bills, receipts, payment reminders, procurement and accounts-payable mail.
        examples:
          - "Invoice INV-3391 is attached and due on the 30th."
      support:
        what: An existing customer with a problem or a question about the product.
      recruiting:
        what: Job applications, candidate outreach, and recruiters pitching candidates.
      junk:
        what: Cold sales pitches at us, SEO offers, mass mail and obvious spam.
      other:
        what: Legitimate mail that fits none of the above.
    min_confidence: 0.35
    on_low_confidence: human_review

  is_urgent:
    type: noul
    instructions: >
      The sender needs an answer today: an outage, a legal or payment deadline,
      or an explicit deadline within 24 hours.

  is_automated:
    type: noul
    instructions: The message was generated by a machine rather than typed by a person.

  queue:
    type: rule
    expr: 'is_urgent.p > 0.6 ? destination.choice + "-urgent" : destination.choice'

output:
  inbox: destination.choice
  queue: queue.value
  urgent: is_urgent.p
  automated: is_automated.p
  needs_review: destination.low_confidence

tests:
  - input: { body: "What does the team plan cost for 40 seats?" }
    expect: { inbox: sales }
  - input: { body: "Invoice INV-3391 is attached, due on the 30th." }
    expect: { inbox: invoices }
  - input: { body: "I'd like to apply for the backend engineer role, CV attached." }
    expect: { inbox: recruiting }
  - input: { body: "We're an agency that can 10x your SEO, book a call?" }
    expect: { inbox: junk }
  - input: { body: "Our production instance has been down for an hour, we're on the Pro plan." }
    expect: { inbox: support, urgent: null }
  - input: { body: "We build a CRM and would like to integrate with your API. Interested in partnering?" }
    expect: { inbox: partnerships }
  - input: { body: "Your card ending 4242 was declined, please update payment details." }
    expect: { inbox: invoices }
  - input: { body: "Can I get a demo next week for my team of 12?" }
    expect: { inbox: sales }
  - input: { body: "I have three senior Go engineers available for contract work." }
    expect: { inbox: recruiting }
  - input: { body: "How do I rotate an API key? I can't find it in the docs." }
    expect: { inbox: support }
